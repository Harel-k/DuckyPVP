arena:
  world: world
  region: sandpvp
  excluded-regions:
    - spawn
  reset-interval-seconds: 900
  broadcast-reset: true
  reset-message: "&6&lDUCKY PVP &8» &eArena reset! New kit: &f%kit%"

ui:
  entry-title:
    enabled: true
    title: "&6&lWELCOME TO DUCKY PVP"
    subtitle: "&7Kit: &f%kit% &8• &7Reset in &f%time%"
    fade-in: 10
    stay: 50
    fade-out: 10
  kit-change-title:
    enabled: true
    title: "&e&lNEW KIT"
    subtitle: "&f%kit%"
  bossbar:
    enabled: true
    title: "&6Kit: &f%kit% &8• &eReset in &f%time%"
    color: YELLOW
    style: SOLID
  vote-menu:
    title: "&8Vote for the Next Kit"

reset:
  remove-temporary-entities: true
  temporary-entities:
    - END_CRYSTAL
    - TNT
    - ITEM
    - ARROW
    - SPECTRAL_ARROW
    - TRIDENT
    - FALLING_BLOCK
    - FIREWORK_ROCKET

kits:
  heal-on-enter: true
  feed-on-enter: true
