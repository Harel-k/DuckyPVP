name: Release DuckyPVP

on:
  push:
    branches:
      - 'release-aligned-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#release-aligned-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i -E 's/version = "[^"]+"/version = "'"$VERSION"'"/' build.gradle.kts

      - name: Apply arena runtime fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/qducks/duckypvp/ArenaManager.java')
          text = path.read_text(encoding='utf-8')

          old_timer = 'nextResetAtMillis = System.currentTimeMillis() + resetIntervalTicks * 50L;'
          new_timer = 'nextResetAtMillis = ((System.currentTimeMillis() / Math.max(1000L, resetIntervalTicks * 50L)) + 1L) * Math.max(1000L, resetIntervalTicks * 50L);'
          timer_count = text.count(old_timer)
          if timer_count != 2:
              raise SystemExit(f'Expected 2 timer expressions, found {timer_count}')
          text = text.replace(old_timer, new_timer)

          old_clear = '        excludedRegionNames.clear();\n'
          new_clear = '        excludedRegionNames.clear();\n        excludedRegionNames.add("spawn");\n'
          if old_clear not in text:
              raise SystemExit('Could not find excluded-region initialization')
          text = text.replace(old_clear, new_clear, 1)

          import_anchor = 'import com.sk89q.worldguard.WorldGuard;\n'
          imports = 'import com.sk89q.worldguard.WorldGuard;\nimport com.sk89q.worldguard.protection.flags.Flags;\nimport com.sk89q.worldguard.protection.regions.RegionQuery;\n'
          if import_anchor not in text:
              raise SystemExit('Could not find WorldGuard import anchor')
          text = text.replace(import_anchor, imports, 1)

          arena_anchor = '        if (arenaRegion == null || !arenaRegion.contains(point)) {\n            return false;\n        }\n\n'
          pvp_guard = '        if (arenaRegion == null || !arenaRegion.contains(point)) {\n            return false;\n        }\n\n        RegionQuery query = WorldGuard.getInstance().getPlatform().getRegionContainer().createQuery();\n        if (!query.testState(BukkitAdapter.adapt(location), null, Flags.PVP)) {\n            return false;\n        }\n\n'
          if arena_anchor not in text:
              raise SystemExit('Could not find arena containment check')
          text = text.replace(arena_anchor, pvp_guard, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare stable JAR name
        run: cp "build/libs/DuckyPVP-${{ steps.version.outputs.version }}.jar" build/libs/DuckyPVP.jar

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DuckyPVP v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            build/libs/DuckyPVP-${{ steps.version.outputs.version }}.jar
            build/libs/DuckyPVP.jar
          fail_on_unmatched_files: true
