name: Release DuckyPVP

on:
  push:
    branches:
      - release-v0.4.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version to 0.4.0
        run: sed -i 's/version = "0.3.0"/version = "0.4.0"/' build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare stable JAR name
        run: cp build/libs/DuckyPVP-0.4.0.jar build/libs/DuckyPVP.jar

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          name: DuckyPVP v0.4.0
          target_commitish: ${{ github.sha }}
          body: |
            DuckyPVP v0.4.0 for QDucks SMP.

            - 10 second arena-entry combat lock
            - Player-caused damage resets attacker and victim to 20 seconds
            - Blocks /spawn, /rtp, /home, /back, warps and teleport-request commands while locked
            - Server-enforced invisible arena boundary while locked
            - Actionbar combat countdown
            - Death clears the combat lock
            - Includes all v0.3.0 vanilla PvP kits, voting, bossbar, queuekit and arena reset features
          files: |
            build/libs/DuckyPVP-0.4.0.jar
            build/libs/DuckyPVP.jar
          fail_on_unmatched_files: true
