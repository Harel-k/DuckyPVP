arena:
  world: world
  region: sandpvp
  excluded-regions:
    - spawn
  reset-interval-seconds: 900
  broadcast-reset: true
  reset-message: "&6&lDUCKY PVP &8» &eArena reset! New kit: &f%kit%"

ui:
  entry-title:
    enabled: true
    title: "&6&lWELCOME TO DUCKY PVP"
    subtitle: "&7Kit: &f%kit% &8• &7Reset in &f%time%"
    fade-in: 10
    stay: 50
    fade-out: 10
  kit-change-title:
    enabled: true
    title: "&e&lNEW KIT"
    subtitle: "&f%kit%"
  bossbar:
    enabled: true
    title: "&6Kit: &f%kit% &8• &eReset in &f%time%"
    color: YELLOW
    style: SOLID
  vote-menu:
    title: "&8Vote for the Next Kit"

combat:
  enabled: true
  entry-lock-seconds: 10
  pvp-lock-seconds: 20
  bypass-permission: duckypvp.combat.bypass
  blocked-commands:
    - spawn
    - rtp
    - wild
    - home
    - back
    - warp
    - tpa
    - tpahere
    - tpaccept
  ui:
    actionbar: "&c&lCOMBAT &8» &f%time%s &7• &cYou cannot leave the arena"
  messages:
    command-blocked: "&c&lCOMBAT &8» &7You cannot use &f/%command% &7for another &c%time%s&7."
    exit-blocked: "&c&lCOMBAT &8» &7You cannot leave the PvP arena for another &c%time%s&7."
    released: "&a&lCOMBAT &8» &7You can now leave the PvP arena."

reset:
  remove-temporary-entities: true
  temporary-entities:
    - END_CRYSTAL
    - TNT
    - ITEM
    - ARROW
    - SPECTRAL_ARROW
    - TRIDENT
    - FALLING_BLOCK
    - FIREWORK_ROCKET

kits:
  heal-on-enter: true
  feed-on-enter: true

# Keeps kit items inside the arena: kit items can't be dropped, stored in
# containers/item frames, crafted with, or picked up outside the arena, and
# blocks broken by kitted players inside the arena don't drop anything.
# Missing keys fall back to these defaults, so older config.yml files are covered.
kit-protection:
  enabled: true
  # Commands blocked while a player holds an arena kit (selling, storing or
  # receiving items that would be lost or leaked when the kit is removed).
  blocked-commands:
    - sell
    - sellall
    - ah
    - auctionhouse
    - order
    - orders
    - shop
    - trade
    - ec
    - enderchest
    - echest
    - craft
    - workbench
    - wb
    - anvil
    - pv
    - playervault
    - playervaults
    - trash
    - disposal
    - crates
    - abuse
    - adminmode
  messages:
    command-blocked: "&6&lDUCKY PVP &8» &7You cannot use &f/%command% &7while you have an arena kit."
