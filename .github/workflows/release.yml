name: Release DuckyPVP

on:
  push:
    branches:
      - release-v0.3.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: DuckyPVP v0.3.0
          target_commitish: ${{ github.sha }}
          body: |
            DuckyPVP v0.3.0 for QDucks SMP.

            - Replaced fantasy/class kits with real vanilla PvP practice modes
            - Sword, Axe, SMP, Diamond SMP, NethOP
            - Crystal and Diamond Crystal
            - NethPot, DiaPot and IronPot with real potion metadata
            - UHC, Mace, Spear Mace and Cart
            - Elytra Mace, Trident Mace, Bow and OG Vanilla
            - Added multi-slot item support for potion-heavy kits
            - Keeps v0.2 voting, bossbar, titles, queuekit, forcekit and forcereset systems
          files: build/libs/DuckyPVP-0.3.0.jar
          fail_on_unmatched_files: true
