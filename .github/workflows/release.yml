name: Release DuckyPVP

on:
  push:
    branches:
      - release-v0.2.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: DuckyPVP v0.2.0
          target_commitish: ${{ github.sha }}
          body: |
            DuckyPVP v0.2.0 for QDucks SMP.

            - Custom arena welcome title with active kit and reset countdown
            - Bossbar visible in the arena with current kit and live MM:SS reset timer
            - /votekit GUI with player voting for the next timed kit
            - Admin queued kit overrides votes for the next natural reset
            - /duckypvp queuekit <kit>
            - /duckypvp forcekit <kit> changes kit immediately without resetting the timer
            - /duckypvp forcereset resets arena damage immediately without changing timer or kit
            - /duckypvp clearqueue and /duckypvp forcerandom helpers
            - Expanded roster with 15 distinct PvP kits
            - Existing inventory backup, WorldGuard region detection, and 15-minute arena restoration retained
          files: build/libs/DuckyPVP-0.2.0.jar
          fail_on_unmatched_files: true
