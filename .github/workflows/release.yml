name: Release DuckyPVP

on:
  push:
    branches:
      - 'release-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#release-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i -E 's/version = "[^"]+"/version = "'"$VERSION"'"/' build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare stable JAR name
        run: cp "build/libs/DuckyPVP-${{ steps.version.outputs.version }}.jar" build/libs/DuckyPVP.jar

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DuckyPVP v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            build/libs/DuckyPVP-${{ steps.version.outputs.version }}.jar
            build/libs/DuckyPVP.jar
          fail_on_unmatched_files: true
